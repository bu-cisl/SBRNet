program: sbrnet_core/sbrnet/main.py
method: "grid"
metric:
  name: qlo_val_loss
  goal: minimize

parameters:
  learning_rate:
    values: [0.00001, 0.0001, 0.001]
  lr_scheduler:
    values: ["cosine_annealing", "cosine_annealing_with_warm_restarts", "step_lr"]
  num_resblocks:
    values: [14, 22]
  model_dir:
    value: ["/projectnb/tianlabdl/rjbona/trained_models/"]
  batch_size:
    value: [20]
  view_ind:
    value: [15]
  point_loss_weight:
    value: [1]
  qlo_weight:
    value: [1]
  qhi_weight:
    value: [1]
  cosine_annealing_T_max:
    value: [30]
  num_head_layers:
    value: [1]
  weight_decay:
    value: [0]
  optimizer:
    value: ["adam"]
  q_lo:
    value: [0.5]
  q_hi:
    value: [0.95]
  output_activation:
    value: ["sigmoid"]
  backbone:
    value: ["resnet"]
  patch_size:
    value: [128]
  dataset_pq:
    value: ["/ad/eng/research/eng_research_cisl/jalido/sbrnet/data/training_data/UQ/15/metadata.pq"]